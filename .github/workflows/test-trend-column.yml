name: Test trend column

on:
  push:
    branches:
      - trend-column-v1
    paths:
      - "scanner.py"
      - "indicators.py"
      - "tests_trend_classification.py"
      - ".github/workflows/test-trend-column.yml"
  pull_request:
    paths:
      - "scanner.py"
      - "indicators.py"
      - "tests_trend_classification.py"
      - ".github/workflows/test-trend-column.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile scanner.py indicators.py
      - run: python tests_trend_classification.py
