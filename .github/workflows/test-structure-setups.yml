name: Test structural setups

on:
  push:
    branches:
      - add-structure-pattern-setups
  pull_request:
    paths:
      - "structure_setups.py"
      - "classic_setups.py"
      - "app.py"
      - "tests_structure_setups.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py classic_setups.py scanner.py structure_setups.py
      - run: python tests_structure_setups.py
