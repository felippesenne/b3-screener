name: Test strategy setups

on:
  push:
    branches:
      - main
    paths:
      - "momentum_205080_setups.py"
      - "structure_setups.py"
      - "classic_setups.py"
      - "scanner.py"
      - "app.py"
      - "tests_structure_setups.py"
      - "tests_momentum_205080.py"
      - "tests_landry_simple.py"
      - ".github/workflows/test-structure-setups.yml"
  pull_request:
    paths:
      - "momentum_205080_setups.py"
      - "structure_setups.py"
      - "classic_setups.py"
      - "scanner.py"
      - "app.py"
      - "tests_structure_setups.py"
      - "tests_momentum_205080.py"
      - "tests_landry_simple.py"
      - ".github/workflows/test-structure-setups.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py classic_setups.py scanner.py structure_setups.py momentum_205080_setups.py
      - run: python tests_structure_setups.py
      - run: python tests_momentum_205080.py
      - run: python tests_landry_simple.py
