name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile modules
        run: python -m py_compile app.py scanner.py indicators.py data_provider.py
      - name: Import scanner
        run: python -c "from scanner import describe_strategy, scan_universe; print(describe_strategy([{'left': {'kind': 'RSI', 'period': 2}, 'operator': '<', 'right_kind': 'value', 'right_value': 25.0}]))"
