name: Atualizar dados B3

on:
  schedule:
    # 20:00 em Brasília (UTC-3), segunda a sexta.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: b3-market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar configuração do banco
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL não configurada nos GitHub Actions secrets."
            exit 1
          fi

      - name: Atualizar banco
        run: python update_market_data.py
