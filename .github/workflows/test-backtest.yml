name: Test backtest engine

on:
  push:
    branches:
      - backtest-v1
      - backtest-v1-core
      - backtest-v1-orders
      - backtest-v1-ui
      - rename-screener-nav
    paths:
      - "app.py"
      - "backtest/**"
      - "pages/**"
      - "tests_backtest_engine.py"
      - "tests_backtest_signals.py"
      - "tests_backtest_cli.py"
      - "tests_backtest_orders.py"
      - "tests_backtest_ui_helpers.py"
      - "tests_backtest_streamlit_smoke.py"
      - "tests_navigation_smoke.py"
      - ".github/workflows/test-backtest.yml"
  pull_request:
    paths:
      - "app.py"
      - "backtest/**"
      - "pages/**"
      - "tests_backtest_engine.py"
      - "tests_backtest_signals.py"
      - "tests_backtest_cli.py"
      - "tests_backtest_orders.py"
      - "tests_backtest_ui_helpers.py"
      - "tests_backtest_streamlit_smoke.py"
      - "tests_navigation_smoke.py"
      - ".github/workflows/test-backtest.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py pages/Screener.py pages/1_Backtesting.py backtest/__init__.py backtest/engine.py backtest/metrics.py backtest/signals.py backtest/order_engine.py backtest/setup_orders.py backtest/ui_helpers.py backtest/cli.py
      - run: python tests_backtest_engine.py
      - run: python tests_backtest_signals.py
      - run: python tests_backtest_cli.py
      - run: python tests_backtest_orders.py
      - run: python tests_backtest_ui_helpers.py
      - run: python tests_backtest_streamlit_smoke.py
      - run: python tests_navigation_smoke.py
